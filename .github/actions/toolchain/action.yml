name: Toolchain
description: >-
  Put a runner on the pinned toolchain — Xcode 27 and just. Every CI job needs
  exactly this, so it is held once here rather than repeated per job.

runs:
  using: composite
  steps:
    - name: Install just
      shell: bash
      run: brew install just

    # Xcode 27.0 is the pinned toolchain and the reason is machine/CI parity: the SDK
    # decides which iOS 27 APIs compile, and an unguarded one is the single most likely
    # mistake to reach this repo. Building against a different SDK than the owner's
    # machine is how that mistake gets through green CI.
    #
    # This fails rather than falling back. A fallback would be unreachable anyway: the
    # jobs pin `runs-on: xcode-27`, so either the image exists and carries Xcode 27, or
    # the job never starts. If that image is ever withdrawn, changing the pin is a
    # deliberate edit — not something a warning should let slide into a green check.
    - name: Select Xcode 27
      shell: bash
      run: |
        set -euo pipefail
        want=27

        candidate=$(ls -d /Applications/Xcode_${want}*.app 2>/dev/null | sort -V | tail -1 || true)
        if [[ -n "$candidate" ]]; then
            sudo xcode-select -switch "$candidate"
        fi

        active=$(xcodebuild -version | head -1 | awk '{print $2}')
        if [[ "${active%%.*}" != "$want" ]]; then
            echo "::error title=Xcode ${want} not on this runner::Active Xcode is ${active}. This runner cannot give machine/CI parity; a pass here would prove less than it looks. Change the pinned image and toolchain deliberately, or use a runner that carries Xcode ${want}."
            exit 1
        fi

        xcodebuild -version
